<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | BeSeen</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif}body{min-height:100dvh;background:linear-gradient(135deg,#071b44,#123e84);display:grid;place-items:center;padding:24px;color:#10213f}.card{width:min(440px,100%);background:#fff;border-radius:24px;padding:clamp(22px,5vw,38px);box-shadow:0 30px 90px #0005}.logo{text-align:center;font-size:35px;font-weight:950;letter-spacing:-.06em;margin-bottom:23px}.logo span:first-child{color:#ed334f}.logo span:last-child{color:#1877ff}.tabs{display:flex;border-radius:12px;background:#eef3fa;padding:4px;margin-bottom:23px}.tabs button{flex:1;border:0;border-radius:9px;padding:12px;background:none;color:#30405c;font:inherit;font-weight:750;cursor:pointer}.tabs button[aria-selected=true]{background:#fff;color:#10213f;box-shadow:0 2px 8px #071b441c}h1{font-size:25px;margin:0 0 7px}p{line-height:1.5;color:#65748e;margin:0 0 20px}.field{display:block;font-size:14px;font-weight:750;margin:15px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #cdd8e8;border-radius:11px;font:inherit;font-size:16px}input:focus{outline:2px solid #1877ff;outline-offset:1px}.primary,.google{display:block;width:100%;padding:14px 16px;border-radius:11px;font:inherit;font-weight:800;cursor:pointer}.primary{margin-top:22px;background:#1877ff;color:#fff;border:0}.google{background:#fff;color:#17233c;border:1px solid #cdd8e8;margin-top:14px}.or{text-align:center;color:#7d8aa1;margin:17px 0 0}.message{margin-top:15px;min-height:22px;color:#b11f35;font-size:14px}.back{display:block;text-align:center;color:#1877ff;margin-top:20px;text-decoration:none;font-weight:700}.overlay{position:fixed;inset:0;background:#031024da;display:grid;place-items:center;padding:22px;z-index:10}.overlay[hidden],[hidden]{display:none!important}.panel{background:white;width:min(440px,100%);border-radius:24px;text-align:center;padding:36px 26px;box-shadow:0 25px 80px #0006}.icon{font-size:46px;color:#138a55;margin-bottom:12px}.spin{width:54px;height:54px;border:5px solid #dce8fb;border-top-color:#1877ff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 17px}@keyframes spin{to{transform:rotate(360deg)}}.email{word-break:break-all;font-weight:800;color:#10213f}.small{font-size:14px}
</style></head><body>
<main class="card"><div class="logo"><span>Be</span><span>Seen</span></div><div class="tabs" role="tablist"><button type="button" id="loginTab" aria-selected="true">Sign In</button><button type="button" id="createTab" aria-selected="false">Create Account</button></div>
<h1 id="title">Welcome back</h1><p id="subtitle">Sign in to manage your advertising.</p>
<form id="form"><div id="nameWrap" hidden><label class="field" for="name">Full name</label><input id="name" autocomplete="name"></div><label class="field" for="email">Email</label><input id="email" type="email" autocomplete="email" required><label class="field" for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button id="submit" class="primary" type="submit">Sign In</button></form>
<div class="or">or</div><button class="google" id="google" type="button">Continue with Google</button><div class="message" id="message" role="alert"></div><a class="back" href="/">Back to BeSeen</a></main>
<div class="overlay" id="overlay" hidden><div class="panel"><div id="icon" class="spin"></div><h1 id="overlayTitle">Creating your account…</h1><p id="overlayText">Just a second while we set up your BeSeen account.</p><div id="overlayEmail" class="email"></div><button class="primary" id="closeOverlay" type="button" hidden>Got it</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{let mode='login',clientPromise,busy=false;const $=id=>document.getElementById(id),returnTo=new URLSearchParams(location.search).get('returnTo')||'/';function safeReturn(){return returnTo.startsWith('/')&&!returnTo.startsWith('//')?returnTo:'/'}function setMode(next){mode=next;const create=next==='create';$('loginTab').setAttribute('aria-selected',String(!create));$('createTab').setAttribute('aria-selected',String(create));$('nameWrap').hidden=!create;$('title').textContent=create?'Create your account':'Welcome back';$('subtitle').textContent=create?'Start advertising with BeSeen.':'Sign in to manage your advertising.';$('submit').textContent=create?'Create Account':'Sign In';$('password').autocomplete=create?'new-password':'current-password';$('message').textContent=''}$('loginTab').onclick=()=>setMode('login');$('createTab').onclick=()=>setMode('create');$('closeOverlay').onclick=()=>$('overlay').hidden=true;async function client(){if(!clientPromise)clientPromise=(async()=>{const response=await fetch('/api/config');if(!response.ok)throw Error('Authentication is unavailable.');const cfg=await response.json();if(!cfg.supabaseUrl||!cfg.supabasePublishableKey)throw Error('Authentication is not configured.');const store=localStorage.getItem('beseen_remember_me')==='1'?localStorage:sessionStorage;return supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:{getItem:k=>store.getItem(k),setItem:(k,v)=>store.setItem(k,v),removeItem:k=>store.removeItem(k)}}})})();return clientPromise}function overlay(title,description,email,done){$('overlay').hidden=false;$('overlayTitle').textContent=title;$('overlayText').textContent=description;$('overlayEmail').textContent=email||'';$('icon').className=done?'icon':'spin';$('icon').textContent=done?'✓':'';$('closeOverlay').hidden=!done}function fail(error){$('overlay').hidden=true;$('message').textContent=error?.message||'Something went wrong. Please try again.'}
$('form').addEventListener('submit',async event=>{event.preventDefault();if(busy)return;busy=true;const email=$('email').value.trim(),password=$('password').value;if(mode==='create')overlay('Creating your account…','Just a second while we set up your BeSeen account.',email,false);else $('submit').textContent='Signing in…';try{const auth=(await client()).auth;if(mode==='create'){const {error}=await auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/verify-email.html',data:{full_name:$('name').value.trim()}}});if(error)throw error;overlay('Account created!','Check your inbox and click the verification link to continue.',email,true)}else{const {error}=await auth.signInWithPassword({email,password});if(error)throw error;location.assign(safeReturn())}}catch(error){fail(error)}finally{busy=false;$('submit').textContent=mode==='create'?'Create Account':'Sign In'}});
$('google').onclick=async()=>{try{$('message').textContent='Connecting to Google…';const {error}=await(await client()).auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+safeReturn()}});if(error)throw error}catch(error){fail(error)}};})();
</script></body></html>
