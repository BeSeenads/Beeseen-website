<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BeSeen Advertising</title>
  <meta name="theme-color" content="#071b44">
  <style>
    html,body{margin:0;min-height:100%;background:#071b44;color:white;font-family:Arial,sans-serif}
    .loading{
  min-height:100vh;
  display:grid;
  place-items:center;
  text-align:center;
  padding:24px;
}

.beseen-loader{
  width:min(620px,92vw);
  display:flex;
  flex-direction:column;
  align-items:center;
}

.beseen-loader-logo{
  font-size:58px;
  font-weight:950;
  letter-spacing:-.06em;
  line-height:1;
  margin-bottom:24px;
}

.loader-be{
  color:#ed334f;
  text-shadow:0 0 22px rgba(237,51,79,.45);
}

.loader-seen{
  color:#4a9aff;
  text-shadow:0 0 22px rgba(74,154,255,.45);
}

.beseen-loader-marquee{
  width:100%;
  overflow:hidden;
  border-top:1px solid rgba(255,255,255,.18);
  border-bottom:1px solid rgba(255,255,255,.18);
  padding:14px 0;
}

.beseen-loader-track{
  display:inline-block;
  white-space:nowrap;
  min-width:max-content;
  animation:beseenMarquee 14s linear infinite;
  font-size:14px;
  font-weight:900;
  letter-spacing:.08em;
}

.beseen-loader-track span{
  margin-right:38px;
}

.beseen-loader-track span:nth-child(odd){
  color:#ed334f;
}

.beseen-loader-track span:nth-child(even){
  color:#4a9aff;
}

.beseen-loader-text{
  margin-top:20px;
  color:rgba(255,255,255,.72);
  font-size:14px;
  font-weight:800;
}

@keyframes beseenMarquee{
  from{
    transform:translateX(0);
  }
  to{
    transform:translateX(-50%);
  }
}

@media(max-width:600px){
  .beseen-loader-logo{
    font-size:48px;
  }

  .beseen-loader-track{
    font-size:12px;
  }
}
  </style>
</head>
<body>
  <div class="loading" id="beseenLoader">
  <div class="beseen-loader">

    <div class="beseen-loader-logo">
      <span class="loader-be">Be</span><span class="loader-seen">Seen</span>
    </div>

    <div class="beseen-loader-marquee">
      <div class="beseen-loader-track">

        <span>EXPOSURE</span>
        <span>VISIBILITY</span>
        <span>REACH</span>
        <span>ATTENTION</span>
        <span>IMPACT</span>
        <span>AWARENESS</span>
        <span>MORE EYES</span>
        <span>MORE SCREENS</span>
        <span>BE EVERYWHERE</span>
        <span>GET NOTICED</span>
        <span>BE SEEN</span>

        <span>EXPOSURE</span>
        <span>VISIBILITY</span>
        <span>REACH</span>
        <span>ATTENTION</span>
        <span>IMPACT</span>
        <span>AWARENESS</span>
        <span>MORE EYES</span>
        <span>MORE SCREENS</span>
        <span>BE EVERYWHERE</span>
        <span>GET NOTICED</span>
        <span>BE SEEN</span>

      </div>
    </div>

    <div class="beseen-loader-text">
      Making sure your brand gets seen
    </div>

  </div>
</div>
  <script>
 (async function(){
  const loaderStarted = Date.now();
  const minLoaderMs = 900;

  try{
      const response = await fetch('/beseen-payment-success.html', {cache:'no-store'});
      if(!response.ok) throw new Error('Main site could not be loaded');
      let html = await response.text();
      const bridge = '<script src="/beseen-account-bridge.js"><\/script>';
      if (/<\/body>/i.test(html)) html = html.replace(/<\/body>/i, bridge + '</body>');
      else html += bridge;
     const elapsed = Date.now() - loaderStarted;
const remaining = minLoaderMs - elapsed;

if (remaining > 0) {
  await new Promise(resolve => setTimeout(resolve, remaining));
}

document.open();
document.write(html);
document.close();
    }catch(error){
      console.error(error);
      window.location.replace('/beseen-payment-success.html' + window.location.search + window.location.hash);
    }
  })();
  </script>
</body>
</html>
