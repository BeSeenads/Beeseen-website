<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Your Email | BeSeen</title>
<meta name="theme-color" content="#071b44">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#071b44;--blue:#1877ff;--red:#ed334f;--ink:#10213f;--muted:#6f7f9b;--line:#dfe7f3;--bg:#f5f8fd;--green:#138a55}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#e9f2ff 0,transparent 32%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:36px;box-shadow:0 24px 70px #071b4420;text-align:center}.brand{font-size:34px;font-weight:950;letter-spacing:-.06em;margin-bottom:26px}.brand .be{color:var(--red)}.brand .seen{color:var(--blue)}.icon{width:74px;height:74px;margin:0 auto 20px;border-radius:22px;display:grid;place-items:center;background:#edf5ff;color:var(--blue);font-size:36px}h1{font-size:32px;letter-spacing:-.04em;margin:0 0 10px}p{color:var(--muted);line-height:1.65;margin:0 auto 16px;max-width:430px;font-weight:650}.email{display:none;margin:18px auto 0;padding:11px 14px;background:#f7f9fd;border:1px solid #e8eef7;border-radius:12px;font-weight:850;word-break:break-word}.email.show{display:block}.status{margin-top:20px;font-size:13px;font-weight:850;color:#5d6f8c}.spinner{width:22px;height:22px;border:3px solid #d9e6fb;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:18px auto 0;display:none}.spinner.show{display:block}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:850;text-decoration:none;cursor:pointer}.btn-primary{background:var(--blue);color:#fff}.btn-light{background:#fff;color:var(--ink);border:1px solid var(--line)}.success .icon{background:#e8f8ef;color:var(--green)}.error .icon{background:#fff0f2;color:#b11f35}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:600px){.card{padding:28px 20px}h1{font-size:28px}}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="brand"><span class="be">Be</span><span class="seen">Seen</span></div>
  <div class="icon" id="icon">✉</div>
  <h1 id="title">Check your email</h1>
  <p id="message">We sent you a verification link. Open the email and click the link to finish creating your BeSeen account.</p>
  <div class="email" id="emailBox"></div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">You can leave this page open while you verify.</div>
  <div class="actions"><a class="btn btn-light" href="/">Back to BeSeen</a></div>
</main>
<script>
function authStorage(){
  const useLocal=localStorage.getItem('beseen_remember_me')==='1';
  const store=useLocal?localStorage:sessionStorage;
  return {getItem:k=>store.getItem(k),setItem:(k,v)=>store.setItem(k,v),removeItem:k=>store.removeItem(k)};
}
function setState(type,title,message,status){
  const card=document.getElementById('card');
  card.classList.remove('success','error');
  if(type)card.classList.add(type);
  document.getElementById('title').textContent=title;
  document.getElementById('message').textContent=message;
  document.getElementById('status').textContent=status||'';
  document.getElementById('icon').textContent=type==='success'?'✓':type==='error'?'!':'✉';
}
(async()=>{
  const params=new URLSearchParams(location.search);
  const email=params.get('email');
  if(email){const box=document.getElementById('emailBox');box.textContent=email;box.classList.add('show')}
  const hasCallback=params.has('code')||location.hash.includes('access_token=')||params.has('token_hash');
  if(!hasCallback)return;
  document.getElementById('spinner').classList.add('show');
  setState('', 'Verifying your email…','Just a second — we are finishing your BeSeen account.','');
  try{
    const cfg=await fetch('/api/config',{cache:'no-store'}).then(r=>r.json());
    if(!cfg.supabaseUrl||!cfg.supabasePublishableKey)throw new Error('BeSeen authentication is not configured.');
    const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,storage:authStorage(),autoRefreshToken:true,detectSessionInUrl:true}});
    const code=params.get('code');
    if(code){
      const {error}=await sb.auth.exchangeCodeForSession(code);
      if(error && !String(error.message||'').toLowerCase().includes('code verifier'))throw error;
    }
    let session=(await sb.auth.getSession()).data.session;
    if(!session){
      session=await new Promise(resolve=>{
        let done=false;
        const timer=setTimeout(()=>{if(!done){done=true;resolve(null)}},2500);
        const {data}=sb.auth.onAuthStateChange((_event,s)=>{if(s&&!done){done=true;clearTimeout(timer);data.subscription.unsubscribe();resolve(s)}});
      });
    }
    if(!session)throw new Error('Your email may be verified, but we could not finish signing you in automatically.');
    setState('success','Email verified!','Your BeSeen account is ready. We are taking you back to the website now.','Signed in successfully.');
    document.getElementById('spinner').classList.remove('show');
    setTimeout(()=>location.replace('/'),1100);
  }catch(error){
    document.getElementById('spinner').classList.remove('show');
    setState('error','Verification needs one more step',error.message||'We could not complete email verification.','Go back to BeSeen and sign in with the email and password you created.');
  }
})();
</script>
</body>
</html>
